<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Whiteboard (9-Quadrant RTDB)</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f9; }
        /* Style for the mini canvases in overview mode */
        #board-display-area canvas {
            background-color: white;
            cursor: crosshair;
            touch-action: none; /* Prevent scrolling/zooming on touch */
        }
        /* Style for the container to ensure it fills space */
        #board-display-area {
            position: relative;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <div id="loading" class="text-xl font-semibold text-gray-700 p-4 rounded-lg bg-yellow-100 border border-yellow-300 shadow-md">
        Loading Firebase and Authenticating User...
    </div>

    <div id="app" class="hidden w-full max-w-7xl">
        <header class="mb-4 flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-lg border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-800 mb-2 md:mb-0">9-Quadrant Collaborative Whiteboard</h1>
            <div class="text-sm text-gray-600 truncate">
                Your ID: <span id="user-id" class="font-mono text-xs text-blue-600 bg-blue-50 p-1 rounded">...</span>
            </div>
        </header>

        <div class="flex flex-col lg:flex-row gap-6">

            <!-- Controls Panel -->
            <div class="lg:w-1/4 bg-white p-5 rounded-xl shadow-lg border border-gray-100 flex flex-col gap-4 order-2 lg:order-1">
                <h2 class="text-xl font-semibold text-gray-700 mb-2 border-b pb-2">Drawing Tools</h2>

                <!-- Color Picker -->
                <div>
                    <label for="color-picker" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                    <input type="color" id="color-picker" value="#3b82f6" class="w-full h-10 border-2 border-gray-300 rounded-lg p-0.5 shadow-inner">
                </div>

                <!-- Stroke Size Slider -->
                <div>
                    <label for="stroke-size" class="block text-sm font-medium text-gray-700 mb-1">
                        Size: <span id="size-label" class="font-mono text-blue-600">5</span>px
                    </label>
                    <input type="range" id="stroke-size" min="1" max="50" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                </div>
                
                <!-- --- OBJECT TOOLS SECTION --- -->
                <h2 class="text-xl font-semibold text-gray-700 mb-2 border-b pb-2 mt-4">Object Tools</h2>

                <!-- Text Button -->
                <button id="add-text-button" class="w-full py-2 px-4 bg-purple-500 hover:bg-purple-600 text-white font-semibold rounded-lg shadow-md transition duration-150 transform hover:scale-[1.01]">
                    Add Text Label
                </button>
                
                <!-- Image Upload (Now uses Firebase Storage) -->
                <div class="mt-2 p-3 border border-gray-200 rounded-lg shadow-inner bg-gray-50">
                    <label for="image-upload" class="block text-sm font-medium text-gray-700 mb-1">Upload Image (Uses Storage)</label>
                    <input type="file" id="image-upload" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200">
                    <button id="upload-image-button" disabled class="mt-2 w-full py-2 px-4 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg shadow-md transition duration-150 transform hover:scale-[1.01] disabled:bg-green-300">
                        Insert Image to Board
                    </button>
                    <!-- UPDATED WARNING TEXT -->
                    <p class="text-xs text-green-700 mt-1">Images are uploaded to **Firebase Storage**, location saved in RTDB.</p>
                </div>
                <!-- --- END OBJECT TOOLS SECTION --- -->

                <!-- Action Buttons -->
                <div class="mt-4 space-y-3">
                    <!-- NEW: Back Button (visible when zoomed in) -->
                    <button id="back-to-overview-button" class="hidden w-full py-2 px-4 bg-gray-500 hover:bg-gray-600 text-white font-semibold rounded-lg shadow-md transition duration-150 transform hover:scale-[1.01]">
                        ← Back to 9-Quadrant View
                    </button>
                    
                    <button id="undo-button" class="w-full py-2 px-4 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold rounded-lg shadow-md transition duration-150 transform hover:scale-[1.01]">
                        Undo My Last Object
                    </button>
                    <button id="clear-my-drawings-button" class="w-full py-2 px-4 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg shadow-md transition duration-150 transform hover:scale-[1.01]">
                        Clear My Objects Only
                    </button>
                </div>

                <!-- Active Strokes List (for debugging/info) -->
                <div class="mt-6">
                    <h3 class="text-lg font-semibold text-gray-700 border-t pt-3">Live Status</h3>
                    <p class="text-xs text-gray-500 mb-2">Total objects: <span id="stroke-count" class="font-bold">0</span> (Across 9 Boards)</p>
                    <div class="text-sm text-gray-700 mt-1">
                        Data storage: <span class="font-bold text-green-600">Realtime Database</span>
                    </div>
                </div>

            </div>

            <!-- Canvas Area: NEW container for 9 grids or 1 zoomed canvas -->
            <div class="lg:w-3/4 bg-white p-1 rounded-xl shadow-lg border border-gray-100 order-1 lg:order-2 flex justify-center items-center min-h-[70vh]">
                <div id="board-display-area" class="w-full h-full flex justify-center items-center p-2 md:p-4">
                    <!-- Quadrants or Zoomed Canvas will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // RTDB Import
        import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
        // NEW Storage Import
        import { getStorage, ref as storageRef, uploadString, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // Global variables provided by the Canvas environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = {
            apiKey: "AIzaSyDtMk2diPOq5LQnJBtJjPdFukWhtJDhtso",
            authDomain: "whiteboard-7eab0.firebaseapp.com",
            databaseURL: "https://whiteboard-7eab0-default-rtdb.firebaseio.com",
            projectId: "whiteboard-7eab0",
            storageBucket: "whiteboard-7eab0.firebasestorage.app",
            messagingSenderId: "564827963715",
            appId: "1:564827963715:web:fbbacaa3168852f1c86ff6",
            measurementId: "G-KVHX7GG6TE"
        };

        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // UPDATED: Added dbStorage
        let dbRTDB, auth, dbStorage, userId = null; 
        let isDrawing = false;
        let currentStroke = []; 
        let lastTimestamp = 0;

        // State Variables for Multi-Board and Data
        const BOARD_COUNT = 9;
        const RTDB_NODE_PREFIX = 'whiteboard_strokes_'; 
        let allStrokesByBoard = {}; 
        let currentBoardId = null;  
        
        // Global cache for loaded images
        const IMAGE_CACHE = {}; 
        
        // Reference to the currently active (zoomed) canvas element and context
        let currentCanvas = null; 
        let currentCtx = null;    

        const loadingDiv = document.getElementById('loading');
        const appDiv = document.getElementById('app');
        const userIdSpan = document.getElementById('user-id');
        const strokeCountSpan = document.getElementById('stroke-count');
        const colorPicker = document.getElementById('color-picker');
        const sizeSlider = document.getElementById('stroke-size');
        const sizeLabel = document.getElementById('size-label');
        const undoButton = document.getElementById('undo-button');
        const clearMyDrawingsButton = document.getElementById('clear-my-drawings-button');
        
        // References for the UI containers
        const boardDisplayArea = document.getElementById('board-display-area'); 
        const backButton = document.getElementById('back-to-overview-button'); 


        // --- Firebase Initialization and Auth ---

        async function initFirebase() {
            if (!firebaseConfig) {
                console.error("Firebase configuration is missing.");
                loadingDiv.textContent = "Error: Firebase configuration is missing.";
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                dbRTDB = getDatabase(app); 
                dbStorage = getStorage(app); // NEW: Storage Initialization

                await new Promise(resolve => {
                    const unsubscribe = onAuthStateChanged(auth, async (user) => {
                        unsubscribe();

                        if (user) {
                            userId = user.uid;
                        } else {
                            if (initialAuthToken) {
                                await signInWithCustomToken(auth, initialAuthToken);
                                userId = auth.currentUser.uid;
                            } else {
                                await signInAnonymously(auth);
                                userId = auth.currentUser.uid;
                            }
                        }
                        userIdSpan.textContent = userId;
                        console.log("Firebase initialized. User ID:", userId);
                        resolve();
                    });
                });

                // Start the application logic
                window.addEventListener('resize', () => switchBoard(null)); // On resize, refresh overview
                window.addEventListener('load', () => switchBoard(null)); 
                
                setupListeners();
                listenForStrokes(); // Sets up listeners for all 9 boards

                loadingDiv.classList.add('hidden');
                appDiv.classList.remove('hidden');

                switchBoard(null); // Initial render starts in overview mode

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                loadingDiv.textContent = `Initialization Error: ${error.message}`;
            }
        }

        // --- Core Drawing Handlers (Bound to Zoomed Canvas) ---

        /**
         * Gets the mouse/touch position normalized to a 0-1000 grid.
         * It uses the globally set 'currentCanvas' (the zoomed board).
         */
        function getMousePos(event) {
            const targetCanvas = currentCanvas;
            if (!targetCanvas) return {x: 0, y: 0, nx: 0, ny: 0};
            
            const rect = targetCanvas.getBoundingClientRect();
            let x, y;

            if (event.touches && event.touches.length > 0) {
                x = event.touches[0].clientX - rect.left;
                y = event.touches[0].clientY - rect.top;
            } else {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            }

            // Normalize coordinates to a 0-1000 range
            const normalizedX = (x / targetCanvas.width) * 1000;
            const normalizedY = (y / targetCanvas.height) * 1000;

            return { x, y, nx: normalizedX, ny: normalizedY };
        }

        function handleMouseDown(event) {
            if (!currentCanvas || currentBoardId === null) return;
            
            if (event.button === 2) return; 
            isDrawing = true;
            event.preventDefault(); 
            const pos = getMousePos(event);
            lastTimestamp = Date.now();
            currentStroke = [{ x: pos.nx, y: pos.ny, t: lastTimestamp }];
        }

        function handleMouseMove(event) {
            if (!isDrawing || !currentCanvas || currentBoardId === null) return;
            
            event.preventDefault(); 
            const pos = getMousePos(event);

            const lastPoint = currentStroke[currentStroke.length - 1];
            const currentPoint = { x: pos.nx, y: pos.ny, t: Date.now() };

            if (lastPoint) {
                // Denormalize points for local drawing using the zoomed canvas dimensions
                const dx1 = (lastPoint.x / 1000) * currentCanvas.width;
                const dy1 = (lastPoint.y / 1000) * currentCanvas.height;
                const dx2 = (currentPoint.x / 1000) * currentCanvas.width;
                const dy2 = (currentPoint.y / 1000) * currentCanvas.height;

                // Use the currentCtx for local drawing
                currentCtx.beginPath();
                currentCtx.moveTo(dx1, dy1);
                currentCtx.lineTo(dx2, dy2);
                currentCtx.strokeStyle = colorPicker.value;
                currentCtx.lineWidth = parseInt(sizeSlider.value);
                currentCtx.lineCap = 'round';
                currentCtx.stroke();
            }

            currentStroke.push(currentPoint);
        }

        function handleMouseUp(event) {
            if (!isDrawing) return;
            
            isDrawing = false;
            
            if (currentStroke.length > 1) {
                saveCurrentStroke();
            }
            currentStroke = []; 
        }

        // --- UI Setup and Board Management ---

        function setupListeners() {
            // UI Listeners (remain the same)
            sizeSlider.addEventListener('input', (e) => {
                sizeLabel.textContent = e.target.value;
            });

            undoButton.addEventListener('click', deleteLastChunk);
            clearMyDrawingsButton.addEventListener('click', deleteMyDrawings);
            backButton.addEventListener('click', () => switchBoard(null));
            
            // Listeners for Text and Image
            const addTextButton = document.getElementById('add-text-button');
            const imageUpload = document.getElementById('image-upload');
            const uploadImageButton = document.getElementById('upload-image-button');
            
            addTextButton.addEventListener('click', promptAndAddText);
            
            imageUpload.addEventListener('change', () => {
                // Enable button only if a file is selected
                uploadImageButton.disabled = imageUpload.files.length === 0;
            });
            
            uploadImageButton.addEventListener('click', handleImageUpload);
        }
        
        /**
         * Attaches drawing handlers to the newly created zoomed canvas.
         */
        function setupZoomedCanvasListeners(targetCanvas) {
            targetCanvas.onmousedown = handleMouseDown;
            targetCanvas.onmousemove = handleMouseMove;
            targetCanvas.onmouseup = handleMouseUp; 

            targetCanvas.ontouchstart = handleMouseDown;
            targetCanvas.ontouchmove = handleMouseMove;
            targetCanvas.ontouchend = handleMouseUp;
            targetCanvas.ontouchcancel = handleMouseUp;
        }

        /**
         * Switches the view between the 9-quadrant overview and a single zoomed board.
         * @param {number|null} boardId - The ID of the board (1-9) to zoom into, or null for overview.
         */
        function switchBoard(boardId) {
            // If the user clicks 'Back' or a resize event happens, go to overview
            if (boardId === null || isNaN(boardId) || boardId < 1 || boardId > BOARD_COUNT) {
                renderOverview();
                // Disable drawing buttons in overview mode
                undoButton.disabled = true;
                clearMyDrawingsButton.disabled = true;
            } else {
                renderZoomedCanvas(boardId);
                 // Enable drawing buttons in zoomed mode
                undoButton.disabled = false;
                clearMyDrawingsButton.disabled = false;
            }
        }

        // --- RTDB and Data Persistence ---

        const getRTDBRef = (boardId) => {
            // Note: Keeping 'whiteboard_strokes_' for backward compatibility, but it now stores ALL objects.
            const path = `artifacts/${appId}/public/data/${RTDB_NODE_PREFIX}${boardId}`;
            return ref(dbRTDB, path);
        };

        function listenForStrokes() {
            // Setup listeners for all 9 boards
            for (let id = 1; id <= BOARD_COUNT; id++) {
                const dbRef = getRTDBRef(id);

                onValue(dbRef, (snapshot) => {
                    const data = snapshot.val();
                    allStrokesByBoard[id] = data || {};

                    // Redraw the relevant view based on current mode
                    if (currentBoardId === null) {
                        renderOverview();
                    } else if (currentBoardId === id) {
                        redrawSingleCanvas();
                    }
                    
                    updateStrokeCountDisplay();
                    
                }, (error) => {
                    console.error(`Error listening to board ${id}:`, error);
                    showTemporaryMessage(`Error syncing board ${id}. Check RTDB rules.`, "bg-red-100 text-red-700 border-red-300");
                });
            }
        }

        function updateStrokeCountDisplay() {
            let totalCount = 0;
            for (const boardId in allStrokesByBoard) {
                totalCount += Object.keys(allStrokesByBoard[boardId]).length;
            }
            // Updated text to reflect all objects, not just strokes
            strokeCountSpan.textContent = totalCount;
        }
        
        /**
         * Generic function to save any object type (stroke, text, image) to RTDB.
         */
        async function saveObject(boardId, objectData) {
            if (boardId === null) return;
            
            const dbRef = getRTDBRef(boardId);

            try {
                await push(dbRef, objectData);
                showTemporaryMessage(`${objectData.type.toUpperCase()} object saved to Board ${boardId}.`, "bg-green-100 text-green-700 border-green-300");
            } catch (e) {
                console.error("Error pushing data to RTDB: ", e);
                showTemporaryMessage(`Error saving ${objectData.type}. See console.`, "bg-red-100 text-red-700 border-red-300");
            }
        }

        async function saveCurrentStroke() {
            if (currentBoardId === null) {
                console.warn("Attempted to save stroke in overview mode.");
                return;
            }

            if (currentStroke.length < 2) {
                return;
            }
            
            const currentTimestamp = Date.now();
            const strokeData = { 
                type: 'stroke', // IMPORTANT: All objects must have a type
                userId: userId,
                color: colorPicker.value,
                size: parseInt(sizeSlider.value),
                points: currentStroke, 
                createdAt: currentTimestamp,
            };
            
            await saveObject(currentBoardId, strokeData);
        }

        // --- Text Logic ---

        function promptAndAddText() {
            if (currentBoardId === null) {
                showTemporaryMessage("Please zoom into a board to add text.", "bg-yellow-100 text-yellow-700 border-yellow-300");
                return;
            }

            // Use a simple prompt for text input
            const textInput = window.prompt("Enter the text you want to add (will be placed in the center):", "Collaborative Text");
            
            if (textInput && textInput.trim().length > 0) {
                // Default position to center of the canvas
                const normalizedX = 500;
                const normalizedY = 500;

                const textObject = { 
                    type: 'text',
                    userId: userId,
                    text: textInput.trim(),
                    x: normalizedX,
                    y: normalizedY,
                    color: colorPicker.value,
                    size: parseInt(sizeSlider.value), // Use stroke size for font size
                    createdAt: Date.now(),
                };

                saveObject(currentBoardId, textObject);
            }
        }
        
        // --- Image Logic (Now uses Firebase Storage) ---

        function handleImageUpload() {
            if (currentBoardId === null) {
                showTemporaryMessage("Please zoom into a board to upload an image.", "bg-yellow-100 text-yellow-700 border-yellow-300");
                return;
            }
            
            const fileInput = document.getElementById('image-upload');
            const file = fileInput.files[0];
            
            if (!file) return;

            const uploadImageButton = document.getElementById('upload-image-button');
            uploadImageButton.textContent = 'Preparing...';
            uploadImageButton.disabled = true;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Image = e.target.result;
                
                // 1. Define storage paths and file IDs
                const imageId = Date.now().toString() + '_' + Math.random().toString(36).substring(2, 9);
                const storagePath = `images/${appId}/${currentBoardId}/${userId}/${imageId}`;
                const storageReference = storageRef(dbStorage, storagePath);
                
                try {
                    uploadImageButton.textContent = 'Uploading file...';
                    
                    // 2. Upload Base64 string to Firebase Storage using the 'data_url' format
                    const snapshot = await uploadString(storageReference, base64Image, 'data_url'); 
                    
                    // 3. Get the public download URL
                    const downloadUrl = await getDownloadURL(snapshot.ref);
                    
                    uploadImageButton.textContent = 'Saving location...';
                    
                    // 4. Save metadata to RTDB
                    const normalizedX = 500;
                    const normalizedY = 500;
                    
                    const imageObject = {
                        type: 'image',
                        userId: userId,
                        src: downloadUrl, // Store the public URL
                        storagePath: storagePath, // Store path for deletion later
                        x: normalizedX,
                        y: normalizedY,
                        createdAt: Date.now(),
                    };

                    await saveObject(currentBoardId, imageObject); // saveObject function pushes to RTDB
                    showTemporaryMessage("Image uploaded to Storage and registered on board.", "bg-green-100 text-green-700 border-green-300");

                } catch (error) {
                    console.error("Error during image upload to Firebase Storage:", error);
                    showTemporaryMessage(`Image upload failed: ${error.message}`, "bg-red-100 text-red-700 border-red-300");
                } finally {
                    // Reset UI after saving attempt
                    fileInput.value = ''; 
                    uploadImageButton.textContent = 'Insert Image to Board';
                    uploadImageButton.disabled = true;
                }
            };
            reader.readAsDataURL(file);
        }


        // --- Redrawing Logic ---

        /**
         * Redraws the single zoomed canvas (currentBoardId).
         */
        function redrawSingleCanvas() {
            if (currentBoardId === null || !currentCanvas || !currentCtx) return;
            
            const context = currentCtx;
            const canvasWidth = currentCanvas.width;
            
            context.clearRect(0, 0, canvasWidth, canvasWidth);
            
            // Draw all object types
            drawBoardObjects(currentBoardId, currentCanvas, true); 
        }

        /**
         * Draws all stored objects (strokes, text, images) onto a given canvas.
         * @param {number} boardId - The ID of the board whose objects to draw.
         * @param {HTMLCanvasElement} targetCanvas - The canvas element to draw onto.
         * @param {boolean} [isZoomed=false] - If true, uses the actual stroke/font size. If false (overview), scales it down.
         */
        function drawBoardObjects(boardId, targetCanvas, isZoomed = false) {
            const context = targetCanvas.getContext('2d');
            const objects = allStrokesByBoard[boardId] || {}; 
            const canvasWidth = targetCanvas.width;
            const scaleFactor = canvasWidth / 1000;
            
            if (!isZoomed) {
                 context.clearRect(0, 0, canvasWidth, canvasWidth);
            }

            const objectsArray = Object.keys(objects).map(key => ({
                ...objects[key],
                id: key, 
                // Ensure type defaults to 'stroke' for backward compatibility
                type: objects[key].type || 'stroke' 
            })).sort((a, b) => a.createdAt - b.createdAt);

            objectsArray.forEach(object => {
                // Denormalized positions based on canvas size
                const dx = (object.x / 1000) * canvasWidth;
                const dy = (object.y / 1000) * canvasWidth;
                
                switch (object.type) {
                    case 'stroke':
                        if (object.points && object.points.length >= 2) {
                            const lineWidth = isZoomed ? object.size : Math.max(1, object.size / 3); 

                            for (let i = 0; i < object.points.length - 1; i++) {
                                const p1 = object.points[i];
                                const p2 = object.points[i + 1];

                                const start = {
                                    x: (p1.x / 1000) * canvasWidth,
                                    y: (p1.y / 1000) * canvasWidth
                                };
                                const end = {
                                    x: (p2.x / 1000) * canvasWidth,
                                    y: (p2.y / 1000) * canvasWidth
                                };

                                context.beginPath();
                                context.moveTo(start.x, start.y);
                                context.lineTo(end.x, end.y);
                                context.strokeStyle = object.color;
                                context.lineWidth = lineWidth; 
                                context.lineCap = 'round';
                                context.stroke();
                            }
                        }
                        break;
                        
                    case 'text':
                        // Use stroke size for font size, scaled up for better readability
                        const fontSize = isZoomed ? object.size * 2 : Math.max(8, object.size); 
                        
                        context.font = `${fontSize}px Inter, sans-serif`; 
                        context.fillStyle = object.color;
                        context.textAlign = 'center';
                        context.textBaseline = 'middle';
                        
                        context.fillText(object.text, dx, dy);
                        break;
                        
                    case 'image':
                        const imageKey = object.id;
                        let image = IMAGE_CACHE[imageKey];
                        
                        if (!image) {
                            // Load image into cache
                            image = new Image();
                            image.onload = () => {
                                IMAGE_CACHE[imageKey] = image; 
                                // Redraw the canvas once the image is ready
                                if (currentBoardId === boardId) {
                                    redrawSingleCanvas(); 
                                } else {
                                    const miniCanvas = document.getElementById(`board-mini-${boardId}`);
                                    if (miniCanvas) drawBoardObjects(boardId, miniCanvas, false);
                                }
                            };
                            image.onerror = () => {
                                 console.error("Error loading image for drawing:", imageKey);
                            };
                            // object.src is now the Firebase Storage Download URL
                            image.src = object.src; 
                        } 
                        
                        // If the image is loaded, draw it
                        if (image && (image.complete || image.naturalWidth > 0)) {
                            // Example size 150px zoomed, 50px overview
                            const width = isZoomed ? 150 * scaleFactor : 50 * scaleFactor; 
                            const height = width; 
                            
                            context.drawImage(image, dx - width / 2, dy - height / 2, width, height);
                            
                            // Add a small border to identify the image boundary
                            context.strokeStyle = 'rgba(0,0,0,0.5)';
                            context.lineWidth = 1;
                            context.strokeRect(dx - width / 2, dy - height / 2, width, height);
                        }
                        break;
                }
            });
        }
        
        /**
         * Renders the 3x3 grid overview of all boards.
         */
        function renderOverview() {
            currentBoardId = null;
            backButton.classList.add('hidden');
            
            // Calculate size based on parent container
            const containerWidth = boardDisplayArea.clientWidth;
            const quadrantSize = Math.floor(containerWidth / 3);
            
            // Build the 3x3 grid HTML
            let overviewHTML = `<div class="grid grid-cols-3 gap-2 p-2 w-full h-full" style="max-width:${quadrantSize * 3}px;">`;

            for (let i = 1; i <= BOARD_COUNT; i++) {
                overviewHTML += `
                    <div id="quadrant-wrapper-${i}" class="cursor-pointer border border-gray-200 hover:border-blue-400 rounded-lg shadow-md hover:shadow-xl transition-all relative" data-board-id="${i}">
                        <div class="absolute top-1 left-2 text-xs font-semibold text-gray-500 bg-white/70 px-1 rounded-sm">Board ${i}</div>
                        <canvas 
                            id="board-mini-${i}" 
                            width="${quadrantSize}" 
                            height="${quadrantSize}" 
                            class="w-full h-full rounded-lg"
                        ></canvas>
                    </div>
                `;
            }

            overviewHTML += `</div>`;
            boardDisplayArea.innerHTML = overviewHTML;
            
            // Draw content onto the mini canvases and attach click handlers
            for (let i = 1; i <= BOARD_COUNT; i++) {
                const miniCanvas = document.getElementById(`board-mini-${i}`);
                if (miniCanvas) {
                    // Use the new unified draw function
                    drawBoardObjects(i, miniCanvas, false);
                    
                    const wrapper = document.getElementById(`quadrant-wrapper-${i}`);
                    wrapper.addEventListener('click', (e) => {
                        const boardId = parseInt(e.currentTarget.dataset.boardId);
                        if (!isNaN(boardId)) {
                            switchBoard(boardId);
                        }
                    });
                }
            }
        }
        
        /**
         * Renders the single canvas for the zoomed board.
         * @param {number} boardId - The ID of the board to zoom into.
         */
        function renderZoomedCanvas(boardId) {
            currentBoardId = boardId;
            backButton.classList.remove('hidden');

            const containerRect = boardDisplayArea.getBoundingClientRect();
            // Use 95% of the minimum dimension to ensure a nice margin
            const maxSize = Math.min(containerRect.width, containerRect.height) * 0.95; 

            // Create and inject the single zoomed canvas
            const zoomedCanvasHTML = `
                <canvas 
                    id="board-${boardId}" 
                    width="${maxSize}" 
                    height="${maxSize}" 
                    class="rounded-xl shadow-2xl border border-gray-300 transition-all"
                ></canvas>
            `;
            
            boardDisplayArea.innerHTML = zoomedCanvasHTML;
            
            // Re-assign global variables for drawing
            const zoomedCanvas = document.getElementById(`board-${boardId}`);
            currentCanvas = zoomedCanvas;
            currentCtx = zoomedCanvas.getContext('2d');
            
            setupZoomedCanvasListeners(zoomedCanvas);
            
            // Redraw the content
            redrawSingleCanvas();
        }


        // --- Delete/Undo Logic (Scoped to Current Zoomed Board) ---
        
        /**
         * Attempts to delete a file from Firebase Storage.
         * @param {string} storagePath - The full path to the file in Storage.
         */
        async function deleteStorageFile(storagePath) {
            if (!dbStorage || !storagePath) return;
            try {
                const fileRef = storageRef(dbStorage, storagePath);
                await deleteObject(fileRef);
                console.log(`Successfully deleted file from Storage: ${storagePath}`);
            } catch (e) {
                // Ignore 'storage/object-not-found' errors, but log others
                if (e.code !== 'storage/object-not-found') {
                    console.warn(`Could not delete storage file ${storagePath}:`, e);
                }
            }
        }

        async function deleteLastChunk() {
            if (currentBoardId === null) {
                showTemporaryMessage("Please zoom into a board to undo an object.", "bg-yellow-100 text-yellow-700 border-yellow-300");
                return;
            }
            
            const boardStrokes = allStrokesByBoard[currentBoardId] || {};

            const objectsArray = Object.keys(boardStrokes).map(key => ({
                ...boardStrokes[key],
                id: key, // RTDB Key
            }));

            // Filter for the current user and sort in reverse chronological order
            const userObjects = objectsArray
                .filter(object => object.userId === userId)
                .sort((a, b) => b.createdAt - a.createdAt);

            if (userObjects.length > 0) {
                const lastObject = userObjects[0];
                const lastObjectKey = lastObject.id;
                // Path to the specific object node on the current board
                const objectRef = ref(dbRTDB, `artifacts/${appId}/public/data/${RTDB_NODE_PREFIX}${currentBoardId}/${lastObjectKey}`);

                try {
                    // NEW: Delete the corresponding storage file if it's an image
                    if (lastObject.type === 'image' && lastObject.storagePath) {
                        await deleteStorageFile(lastObject.storagePath);
                    }
                    
                    await remove(objectRef);
                    showTemporaryMessage(`Deleted your last object (${lastObject.type}) from Board ${currentBoardId}.`, "bg-green-100 text-green-700 border-green-300");
                } catch (e) {
                    console.error("Error deleting document:", e);
                    showTemporaryMessage("Failed to undo object. See console for details.", "bg-red-100 text-red-700 border-red-300");
                }
            } else {
                showTemporaryMessage(`You have no recent objects (strokes, text, images) to undo on Board ${currentBoardId}.`, "bg-blue-100 text-blue-700 border-blue-300");
            }
        }

        async function deleteMyDrawings() {
             if (currentBoardId === null) {
                showTemporaryMessage("Please zoom into a board to clear your objects.", "bg-yellow-100 text-yellow-700 border-yellow-300");
                return;
            }
            
            // Updated confirmation message
            if (!confirm(`Are you sure you want to permanently clear ALL of YOUR objects (drawings, text, images) from Board ${currentBoardId}? This will not affect other users or other boards.`)) {
                return;
            }

            const boardStrokes = allStrokesByBoard[currentBoardId] || {};
            
            // Find all objects for the current user to get their storage paths
            const userObjectsToDelete = Object.keys(boardStrokes)
                .filter(key => boardStrokes[key].userId === userId)
                .map(key => ({...boardStrokes[key], id: key}));

            if (userObjectsToDelete.length === 0) {
                showTemporaryMessage(`You have no objects on Board ${currentBoardId} to clear.`, "bg-blue-100 text-blue-700 border-blue-300");
                return;
            }

            const rootPath = `artifacts/${appId}/public/data/${RTDB_NODE_PREFIX}${currentBoardId}`;
            let successfulDeletes = 0;

            for (const object of userObjectsToDelete) {
                // NEW: Delete the Storage file first if it's an image
                if (object.type === 'image' && object.storagePath) {
                    await deleteStorageFile(object.storagePath);
                }
                
                // Then delete the RTDB record
                const objectRef = ref(dbRTDB, `${rootPath}/${object.id}`);
                try {
                    await remove(objectRef);
                    successfulDeletes++;
                } catch (e) {
                    console.error(`Error deleting RTDB object ${object.id}:`, e);
                }
            }

            if (successfulDeletes === userObjectsToDelete.length) {
                showTemporaryMessage(`Successfully cleared ${successfulDeletes} of your objects from Board ${currentBoardId}.`, "bg-green-100 text-green-700 border-green-300");
            } else {
                showTemporaryMessage(`Finished clearing. ${successfulDeletes}/${userObjectsToDelete.length} objects deleted successfully.`, "bg-yellow-100 text-yellow-700 border-yellow-300");
            }
        }

        // --- Custom Message Box (Replaces Alert) ---

        function showTemporaryMessage(message, classes) {
            let msgBox = document.getElementById('temp-message');
            if (!msgBox) {
                msgBox = document.createElement('div');
                msgBox.id = 'temp-message';
                msgBox.className = 'fixed top-4 right-4 z-50 p-3 rounded-lg shadow-xl font-medium transition-opacity duration-300 border';
                document.body.appendChild(msgBox);
            }

            msgBox.textContent = message;
            msgBox.className = `fixed top-4 right-4 z-50 p-3 rounded-lg shadow-xl font-medium transition-opacity duration-300 border ${classes} opacity-100`;

            clearTimeout(msgBox.timer);
            msgBox.timer = setTimeout(() => {
                msgBox.classList.remove('opacity-100');
                msgBox.classList.add('opacity-0');
            }, 3000);
        }

        // Initialize the application
        initFirebase();

    </script>
</body>
